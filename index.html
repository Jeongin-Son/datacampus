<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간단한 테트리스</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="layout">
    <section class="board-wrap">
      <h1>🎮 간단한 테트리스</h1>
      <canvas id="board" width="300" height="600" aria-label="테트리스 게임 보드"></canvas>
    </section>

    <aside class="panel">
      <div class="card">
        <h2>점수</h2>
        <p id="score">0</p>
      </div>
      <div class="card">
        <h2>레벨</h2>
        <p id="level">1</p>
      </div>
      <div class="card">
        <h2>조작법</h2>
        <ul>
          <li>← → : 좌우 이동</li>
          <li>↓ : 빠르게 내리기</li>
          <li>↑ / X : 회전</li>
          <li>Z : 반대 회전</li>
          <li>스페이스 : 즉시 내리기</li>
          <li>P : 일시정지</li>
        </ul>
      </div>
      <button id="restart" type="button">다시 시작</button>
      <p id="status" class="status"></p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
